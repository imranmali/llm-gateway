name: CI

# Pushes to main run this workflow through release.yml (workflow_call), so the
# image is only published after the same gates pass.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy (strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Pytest with coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate specs and changes (strict)
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: llm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container with example config
        run: |
          docker run -d --name gw -p 8080:8080 \
            -e LLMGW_DEMO_KEY=sk-ci \
            -v "$PWD/config.example.yaml:/etc/llm-gateway/config.yaml:ro" \
            llm-gateway:ci
      - name: Smoke test endpoints
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/readyz
          curl -fsS -H "Authorization: Bearer sk-ci" http://localhost:8080/v1/models
          curl -fsS -D headers.txt -H "Authorization: Bearer sk-ci" -H "Content-Type: application/json" \
            -d '{"model":"demo","messages":[{"role":"user","content":"hello from CI"}]}' \
            http://localhost:8080/v1/chat/completions
          echo; cat headers.txt
          grep -i '^x-gateway-provider: mock-primary' headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/models)" = "401"
          curl -fsS http://localhost:8080/metrics | grep llmgw_fallbacks_total
      - name: Container logs
        if: always()
        run: docker logs gw
