name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Publish container image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

  deploy:
    name: Deploy (webhook)
    # Opt-in: set repository variable DEPLOY_ENABLED=true and secret DEPLOY_WEBHOOK_URL
    # (e.g. a Render/Railway/Coolify deploy hook) to roll out each published image.
    if: vars.DEPLOY_ENABLED == 'true'
    needs: publish-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          test -n "$DEPLOY_WEBHOOK_URL" || { echo "DEPLOY_WEBHOOK_URL secret is not set"; exit 1; }
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"image\":\"ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}\",\"ref\":\"${GITHUB_SHA}\"}" \
            "$DEPLOY_WEBHOOK_URL"
